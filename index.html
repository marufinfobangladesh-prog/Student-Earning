<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Earning Tasks</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0d1527; color: #ffffff; padding: 15px; }
        .notice-box { background-color: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; }
        .task-card { background-color: #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-link { background-color: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-link:disabled { background-color: #475569; cursor: not-allowed; }
        .select-box { background-color: #1e293b; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
        select, .submit-btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; font-weight: bold; }
        select { background: #0f172a; color: white; border: 1px solid #38bdf8; }
        .submit-btn { background: #16a34a; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="notice-box">
        ⚠️ <b>নোটিশ:</b> লিংকে ২০ সেকেন্ড পূর্ণ সময় থাকতে হবে। ট্যাব পরিবর্তন করলে বা সময় শেষ হওয়ার আগে ফিরে আসলে কাজ গণনা হবে না।
    </div>

    <div id="task-container">
        <!-- ১০টি কাজ -->
        <div class="task-card"><span>টাস্ক #১</span><button class="btn-link" id="btn-1" onclick="openTask(1, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #২</span><button class="btn-link" id="btn-2" onclick="openTask(2, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #৩</span><button class="btn-link" id="btn-3" onclick="openTask(3, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #৪</span><button class="btn-link" id="btn-4" onclick="openTask(4, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #৫</span><button class="btn-link" id="btn-5" onclick="openTask(5, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #৬</span><button class="btn-link" id="btn-6" onclick="openTask(6, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #৭</span><button class="btn-link" id="btn-7" onclick="openTask(7, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #৮</span><button class="btn-link" id="btn-8" onclick="openTask(8, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #৯</span><button class="btn-link" id="btn-9" onclick="openTask(9, 'https://bd-job.top')">কাজ লিংক</button></div>
        <div class="task-card"><span>টাস্ক #১০</span><button class="btn-link" id="btn-10" onclick="openTask(10, 'https://bd-job.top')">কাজ লিংক</button></div>
    </div>

    <!-- টাস্ক শেষে সিলেক্ট অপশন -->
    <div class="select-box" id="submit-section">
        <h3>✅ ২০ সেকেন্ড সম্পন্ন হয়েছে!</h3>
        <p style="font-size:13px; margin-top:5px;">আপনি কোন ধরণের কাজটি সম্পন্ন করেছেন তা সিলেক্ট করুন:</p>
        <select id="task-type-select">
            <option value="normal">নরমাল এড স্ক্রলিং (৳৫)</option>
            <option value="spin">স্পিন টাস্ক (৳৮)</option>
            <option value="app">অ্যাপ ডাউনলোড / বেটিং এড (৳১০)</option>
        </select>
        <button class="submit-btn" onclick="sendDataToBot()">বটে জমা দিন</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        let activeTaskId = null;
        let timeLeft = 20;
        let timerInterval = null;
        let isTabActive = true;

        // ট্যাব অ্যাক্টিভ আছে কিনা ট্র্যাক করা
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                isTabActive = false; // ইউজার অন্য ট্যাবে গেলে কাউন্টডাউন পজ হবে
            } else {
                isTabActive = true;
            }
        });

        function openTask(taskId, targetUrl) {
            activeTaskId = taskId;
            timeLeft = 20;
            const btn = document.getElementById(`btn-${taskId}`);
            
            window.open(targetUrl, '_blank');

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                // কেবল ইউজার সাইটে দৃশ্যমান থাকলে সময় কাউন্ট হবে
                if (isTabActive) {
                    timeLeft--;
                    btn.innerText = `অপেক্ষা (${timeLeft}s)`;

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        btn.innerText = "সম্পন্ন";
                        btn.disabled = true;
                        document.getElementById("submit-section").style.display = "block";
                    }
                } else {
                    btn.innerText = `পজড (${timeLeft}s)`;
                }
            }, 1000);
        }

        function sendDataToBot() {
            const selectedType = document.getElementById("task-type-select").value;
            if (tg && tg.sendData) {
                const payload = JSON.stringify({
                    status: "success",
                    task_type: selectedType
                });
                tg.sendData(payload);
                tg.close();
            } else {
                alert("Telegram App থেকে ওপেন করুন!");
            }
        }
    </script>
</body>
</html>
