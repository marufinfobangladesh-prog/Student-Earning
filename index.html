<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Earning Work Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #00f2fe; margin-top: 0; font-size: 22px; }
        .rule-box {
            background: rgba(0, 242, 254, 0.1);
            border-left: 4px solid #00f2fe;
            padding: 10px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
        }
        .btn {
            width: 100%;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn:disabled {
            background: #4a5568;
            cursor: not-allowed;
        }
        .timer {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
            margin: 15px 0;
        }
        .radio-section {
            display: none;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .radio-option input { margin-right: 12px; transform: scale(1.2); }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎯 আজকের কাজের নিয়মাবলি</h2>
        
        <div class="rule-box">
            <b>📲 অ্যাপ ডাউনলোড / বেটিং এড:</b> লিংকে গিয়ে অ্যাপ ডাউনলোড করলে <b>৳১০</b> পাবেন।
        </div>
        <div class="rule-box">
            <b>🎰 স্পিন টাস্ক:</b> সাইটে কোনো Spin করার অপশন থাকলে Spin করলে <b>৳৮</b> পাবেন।
        </div>
        <div class="rule-box">
            <b>📜 নরমাল এড স্ক্রলিং:</b> সাধারণ এড আসলে ২০ সেকেন্ড স্ক্রল করলে <b>৳৫</b> পাবেন।
        </div>

        <button id="taskBtn" class="btn" onclick="startTask()">🔗 কাজ শুরু করুন (২০ সেকেন্ড অপেক্ষা করুন)</button>
        <div id="timer" class="timer"></div>

        <div id="radioSection" class="radio-section">
            <p style="margin: 0 0 10px 0; color: #00f2fe; font-weight: bold;">কোন কাজ সম্পন্ন করেছেন সিলেক্ট করুন:</p>
            
            <label class="radio-option">
                <input type="radio" name="task_type" value="download">
                📲 অ্যাপ ডাউনলোড করা হয়েছে (৳১০)
            </label>

            <label class="radio-option">
                <input type="radio" name="task_type" value="spin">
                🎰 স্পিন করা হয়েছে (৳৮)
            </label>

            <label class="radio-option">
                <input type="radio" name="task_type" value="normal" checked>
                📜 নরমাল এড স্ক্রলিং করা হয়েছে (৳৫)
            </label>

            <button id="submitBtn" class="btn" onclick="submitTask()">✅ সাবমিট করুন</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let timeLeft = 20;
        let timerId = null;

        function startTask() {
            window.open('https://google.com', '_blank'); 
            
            document.getElementById('taskBtn').disabled = true;
            document.getElementById('timer').innerText = "⏱️ সময় বাকি: " + timeLeft + " সেকেন্ড";

            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = "⏱️ সময় বাকি: " + timeLeft + " সেকেন্ড";
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    document.getElementById('timer').innerText = "✅ ২০ সেকেন্ড সম্পন্ন হয়েছে!";
                    document.getElementById('radioSection').style.display = 'block';
                }
            }, 1000);
        }

        function submitTask() {
            const selectedType = document.querySelector('input[name="task_type"]:checked').value;
            tg.sendData(JSON.stringify({
                status: "success",
                task_type: selectedType
            }));
        }
    </script>
</body>
</html>
