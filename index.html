<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Earning Tasks</title>
    <!-- Telegram WebApp SDK (এটি আবশ্যক) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .notice {
            background-color: #7f1d1d;
            border: 1px solid #ef4444;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .task-card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-title {
            font-size: 14px;
            font-weight: bold;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .timer {
            color: #f59e0b;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="notice">
        ⚠️ <b>জরুরি নোটিশ:</b> ভিপ্রিএন (VPN) ব্যবহার করে কাজ করলে অ্যাকাউন্ট ব্লক করা হবে।
    </div>

    <h3>📋 কাজের তালিকা</h3>

    <!-- টাস্ক ১ -->
    <div class="task-card">
        <div class="task-title">টাস্ক #১ (২০ সেকেন্ড থাকুন)</div>
        <button class="btn" id="btn-1" onclick="startTask(1, 'normal')">কাজ লিংক</button>
    </div>

    <!-- টাস্ক ২ -->
    <div class="task-card">
        <div class="task-title">টাস্ক #২ (২০ সেকেন্ড থাকুন)</div>
        <button class="btn" id="btn-2" onclick="startTask(2, 'normal')">কাজ লিংক</button>
    </div>

    <!-- টাস্ক ৩ (স্পিন) -->
    <div class="task-card">
        <div class="task-title">টাস্ক #৩ (স্পিন টাস্ক)</div>
        <button class="btn" id="btn-3" onclick="startTask(3, 'spin')">কাজ লিংক</button>
    </div>

    <!-- টাস্ক ৪ (অ্যাপ টাস্ক) -->
    <div class="task-card">
        <div class="task-title">টাস্ক #৪ (অ্যাপ টাস্ক)</div>
        <button class="btn" id="btn-4" onclick="startTask(4, 'app')">কাজ লিংক</button>
    </div>

    <script>
        // Telegram WebApp ইনিশিয়ালাইজেশন
        const tg = window.Telegram.WebApp;
        tg.expand();

        function startTask(taskId, taskType) {
            const btn = document.getElementById(`btn-${taskId}`);
            let timeLeft = 20;

            btn.disabled = true;
            btn.innerText = `অপেক্ষা করুন (${timeLeft}s)`;

            // ২০ সেকেন্ডের কাউন্টডাউন টাইমার
            const timer = setInterval(() => {
                timeLeft--;
                btn.innerText = `অপেক্ষা করুন (${timeLeft}s)`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.innerText = "জমা হচ্ছে...";
                    sendTaskToBot(taskType);
                }
            }, 1000);
        }

        // বটের কাছে ডাটা পাঠানোর মূল ফাংশন
        function sendTaskToBot(taskType) {
            if (tg && tg.sendData) {
                const data = JSON.stringify({
                    status: "success",
                    task_type: taskType
                });
                
                // ডাটা টেলিগ্রাম বটে পাঠানো হচ্ছে
                tg.sendData(data);
                
                // ডাটা পাঠনোর পর ওয়েব অ্যাপ অটোমেটিক বন্ধ হয়ে যাবে
                tg.close();
            } else {
                alert("অনুগ্রহ করে টেলিগ্রাম অ্যাপের ভেতর থেকে কাজটি ওপেন করুন।");
            }
        }
    </script>
</body>
</html>
